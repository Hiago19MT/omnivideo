<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YT Downloader</div>
        <p class="subtitle">Baixe vídeos e músicas do YouTube de forma rápida e sem anúncios</p>
    </div>

    <div class="card">
        <div class="search-box">
            <div class="input-group">
                <i class="fa-solid fa-link"></i>
                <input type="text" id="urlInput" placeholder="Cole o link do YouTube aqui (ex: https://youtu.be/...)">
            </div>
            <button type="button" class="btn-analyze" id="btnAnalyze">
                <i class="fa-solid fa-magnifying-glass"></i> Analisar
            </button>
        </div>

        <div id="resultArea" class="result-area">
            <div class="thumb-container">
                <img id="thumbImg" src="" alt="Thumbnail">
            </div>
            
            <h3 id="videoTitle"></h3>

            <div class="form-group">
                <label>Escolha o formato e qualidade:</label>
                <select id="formatSelect"></select>
            </div>

            <button type="button" class="btn-download" id="btnDownload">
                <i class="fa-solid fa-download"></i> Baixar Mídia Agora
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
